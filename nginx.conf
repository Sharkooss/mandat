server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Les assets Vite sont fingerprintés : cache long. Un seul en-tête —
    # `expires` en génère déjà un, en ajouter un seconde fait doublon.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA : tout le reste retombe sur index.html.
    #
    # L'index NE DOIT JAMAIS être mis en cache. Sans en-tête explicite, nginx
    # ne renvoie qu'un ETag et un Last-Modified : les navigateurs appliquent
    # alors leur cache heuristique et Chrome peut resservir l'index de la veille
    # sans revalider. Cet index-là pointe vers un hash d'assets que le
    # déploiement suivant a supprimé, le module part en 404, rien ne se monte —
    # page noire. La navigation privée y échappait, faute de cache disque.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
