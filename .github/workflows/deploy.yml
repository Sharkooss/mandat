name: Deploy

# Déploiement automatique sur le VPS OVH à chaque push sur main.
# Peut aussi être lancé à la main : onglet Actions > Deploy > Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : un push pendant un déploiement attend la fin
# du précédent plutôt que d'interrompre un build en cours.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd /srv/docker/apps/mandat

            echo "→ Récupération du code (miroir strict d'origin/main)"
            git fetch origin main
            git reset --hard origin/main

            echo "→ Build & redémarrage"
            docker compose up -d --build
            docker image prune -f

            echo "→ Vérification que le site répond"
            for i in $(seq 1 12); do
              if curl -fsS -o /dev/null https://mandat.louis-nectoux.fr; then
                echo "✓ Site en ligne"
                exit 0
              fi
              echo "  …démarrage en cours ($i/12)"
              sleep 5
            done
            echo "✗ Le site ne répond pas — vérifie : docker compose logs --tail=100"
            exit 1
